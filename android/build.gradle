// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Si EVENTOS_BUILD_DIR está definida (lo hace scripts/build-apk.js), se compila fuera del proyecto:
// OneDrive bloquea los archivos temporales de Gradle mientras los sincroniza.
if (System.getenv("EVENTOS_BUILD_DIR")) {
    allprojects {
        layout.buildDirectory = new File(System.getenv("EVENTOS_BUILD_DIR"), project.name)
    }
}
