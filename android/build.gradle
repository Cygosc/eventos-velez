// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// El proyecto está en OneDrive, que bloquea archivos mientras sincroniza y rompe la compilación
// ("Unable to delete directory ..."). Por eso la salida de Gradle va a una carpeta fuera de OneDrive, en el MISMO
// disco que el proyecto (Android Studio falla con "'other' has different root" si están en discos distintos).
// Es lo mismo que se hizo en Karen Cat Rescue. Vale para Android Studio y para scripts/build-apk.js.
def localBuildRoot = new File(rootDir.toPath().getRoot().toFile(), "AndroidBuild/CortesCABA")

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    layout.buildDirectory = new File(localBuildRoot, project.name)
}

task clean(type: Delete) {
    delete localBuildRoot
}
