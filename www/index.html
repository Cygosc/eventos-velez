<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Cortes en CABA</title>
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>¿Qué se corta en CABA?</h1>
    <div id="estado" class="estado">Buscando eventos…</div>
  </header>

  <main>
    <section class="panel">
      <div class="acciones">
        <button id="btn-casa">📍 Marcar mi casa</button>
        <button id="btn-avisos">🔔 Activar avisos</button>
      </div>
      <div id="info-casa" class="info-casa"></div>

      <div class="filtros">
        <label>Mostrar
          <select id="radio">
            <option value="1000">a 1 km de mi casa</option>
            <option value="3000">a 3 km de mi casa</option>
            <option value="6000">a 6 km de mi casa</option>
            <option value="0">en toda CABA</option>
          </select>
        </label>
        <div id="tipos" class="tipos"></div>
      </div>

      <h2>Próximos eventos <span id="cuantos" class="cuantos"></span></h2>
      <ul id="lista" class="lista"></ul>
      <p class="nota">Se actualiza todos los martes y jueves.</p>
      <button id="cafecito" class="cafecito" type="button" hidden>☕ ¿Te sirve la app? Invitame un cafecito</button>
    </section>

    <section class="mapa-wrap">
      <form id="buscador" class="buscador" autocomplete="off">
        <input id="direccion" type="search" placeholder="Buscar una dirección (ej.: Rivadavia 5000)" aria-label="Dirección">
        <button type="submit" aria-label="Buscar">🔎</button>
      </form>
      <ul id="resultados" class="resultados"></ul>
      <div id="referencia" class="referencia" hidden></div>
      <div id="mapa"></div>
      <div id="detalle" class="detalle"></div>
    </section>
  </main>

  <script src="vendor/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
